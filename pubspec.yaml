name: dream_track
description: DreamTrack - Tu asistente completo de seguimiento y mejora del sueño.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Sensors
  sensors_plus: ^4.0.2

  # Notifications & Alarms
  flutter_local_notifications: ^17.2.2

  # Background Service
  flutter_background_service: ^5.0.5

  # Audio
  just_audio: ^0.9.40

  # Charts
  fl_chart: ^0.69.0

  # Permissions
  permission_handler: ^11.3.1

  # Do Not Disturb
  do_not_disturb: any

  # App Usage Stats
  usage_stats: ^1.2.0

  # AI
  google_generative_ai: ^0.4.6

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Storage
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Internationalization
  intl: ^0.19.0

  # Gamification Animations
  confetti: ^0.7.0
  lottie: ^3.1.3
  animate_do: ^3.3.4

  # UI Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/lottie/
